<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>奶娃图鉴 · 创作手记</title>
<link rel="stylesheet" href="/film/assets/fonts/fonts.css">
<style>
  :root{
    --paper:#F0EBDE;
    --paper2:#E8E1D0;
    --ink:#2B2620;
    --ink2:#5A5145;
    --red:#E2342B;
    --orange:#F08A2C;
    --yellow:#F5C43C;
    --green:#6FA83C;
    --blue:#3A8ED6;
    --purple:#9B5BC7;
    --cjk:'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif;
    --disp:'Big Shoulders Display',var(--cjk);
    --body:'Albert Sans',var(--cjk);
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:#111;overflow:hidden;}
  #stage{
    position:absolute;left:0;top:0;width:1080px;height:1920px;
    background:var(--paper);overflow:hidden;transform-origin:0 0;
    font-family:var(--cjk);
  }
  /* 纸纹 + 半调网点：整片统一底 */
  #halftone{
    position:absolute;inset:0;pointer-events:none;z-index:900;
    background-image:
      radial-gradient(circle at center, rgba(43,38,32,.42) .95px, transparent 1.15px);
    background-size:5px 5px;
    opacity:.5;mix-blend-mode:multiply;
  }
  /* 纸张纤维 */
  #fiber{
    position:absolute;inset:0;pointer-events:none;z-index:903;opacity:.16;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.012 .42' numOctaves='4' seed='7'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .28  0 0 0 0 .22  0 0 0 .9 0'/></filter><rect width='300' height='300' filter='url(%23f)'/></svg>");
    background-size:420px 420px;
  }
  /* 常驻教材版面框架 */
  #chrome{position:absolute;inset:0;z-index:880;pointer-events:none;}
  .chr-line{position:absolute;left:76px;right:76px;height:2px;background:rgba(43,38,32,.55);}
  .chr-meta{
    position:absolute;left:76px;right:76px;display:flex;justify-content:space-between;
    font-family:var(--mono);font-size:19px;letter-spacing:.14em;color:rgba(43,38,32,.62);
    text-transform:uppercase;
  }
  .chr-rule{position:absolute;left:76px;width:2px;background:rgba(43,38,32,.16);}
  #vignette{
    position:absolute;inset:0;pointer-events:none;z-index:901;
    background:radial-gradient(ellipse 75% 65% at 50% 48%, transparent 55%, rgba(43,38,32,.13) 100%);
  }
  #grain{position:absolute;inset:0;pointer-events:none;z-index:902;opacity:.05;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");
    background-size:180px 180px;mix-blend-mode:multiply;}

  .scene{position:absolute;inset:0;display:none;}
  .scene.on{display:block;}

  .t{font-family:var(--cjk);color:var(--ink);letter-spacing:.01em;line-height:1.24;}
  .mono{font-family:var(--mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;}
  .huge{font-family:var(--disp);font-weight:900;line-height:.86;letter-spacing:-.01em;}

  /* 六色彩条 */
  .bars{position:absolute;left:0;right:0;height:10px;
    background:linear-gradient(90deg,var(--red) 0 16.66%,var(--orange) 16.66% 33.3%,var(--yellow) 33.3% 50%,var(--green) 50% 66.6%,var(--blue) 66.6% 83.3%,var(--purple) 83.3% 100%);}

  /* 剪贴：白边 + 硬阴影 */
  .cut{
    background:#fff;
    box-shadow:0 0 0 6px #fff, 0 10px 0 rgba(43,38,32,.18), 0 22px 46px rgba(43,38,32,.22);
  }
  .cut-img{width:100%;height:100%;object-fit:cover;display:block;}

  .stamp{
    display:inline-block;border:5px solid var(--red);color:var(--red);
    font-family:var(--cjk);font-weight:900;padding:8px 18px;
    transform:rotate(-8deg);opacity:.92;
  }
  .ink-line{height:6px;background:var(--ink);}
  .rule{height:3px;background:var(--ink);}
  .dotrule{height:0;border-top:3px dotted var(--ink2);}
</style>
</head>
<body>
<div id="stage">
  <div class="scene" id="s1"></div>
  <div class="scene" id="s2"></div>
  <div class="scene" id="s3"></div>
  <div class="scene" id="s4"></div>
  <div class="scene" id="s5"></div>
  <div class="scene" id="s6"></div>
  <div class="scene" id="s7"></div>
  <div class="scene" id="s8"></div>
  <div id="chrome">
    <div class="chr-line" style="top:118px"></div>
    <div class="chr-meta" style="top:82px">
      <span>奶娃图鉴 · 创作手记</span>
      <span id="pgno">01 / 08</span>
    </div>
    <div class="chr-rule" style="top:150px;bottom:150px;opacity:.5"></div>
    <div class="chr-line" style="bottom:118px"></div>
    <div class="chr-meta" style="bottom:82px">
      <span>SAKURA CHROMA EDITION</span>
      <span>2026 / 11 / 12</span>
    </div>
  </div>
  <div id="fiber"></div>
  <div id="halftone"></div>
  <div id="vignette"></div>
  <div id="grain"></div>
</div>

<script src="/film/src/film.js"></script>
</body>
</html>
