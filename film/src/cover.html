<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>奶娃图鉴 · 封面</title>
<link rel="stylesheet" href="/film/assets/fonts/fonts.css">
<style>
  :root{
    --paper:#F0EBDE; --paper2:#E8E1D0;
    --ink:#2B2620; --ink2:#5A5145;
    --red:#E2342B; --orange:#F08A2C; --yellow:#C99212;
    --green:#6FA83C; --blue:#3A8ED6; --purple:#9B5BC7;
    --cjk:'Noto Sans SC','Source Han Sans SC','Microsoft YaHei',sans-serif;
    --disp:'Big Shoulders Display',var(--cjk);
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{background:var(--paper);}
  body{font-family:var(--cjk);color:var(--ink);-webkit-font-smoothing:antialiased;}
  #cover{position:relative;width:1080px;height:1440px;overflow:hidden;background:var(--paper);}
  .mono{font-family:var(--mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;}
  .huge{font-family:var(--disp);font-weight:900;line-height:.86;letter-spacing:-.01em;}

  #halftone{position:absolute;inset:0;pointer-events:none;z-index:900;
    background-image:radial-gradient(circle at center, rgba(43,38,32,.42) .95px, transparent 1.15px);
    background-size:5px 5px;opacity:.34;mix-blend-mode:multiply;}
  #fiber{position:absolute;inset:0;pointer-events:none;z-index:903;opacity:.13;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.012 .42' numOctaves='4' seed='7'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .28  0 0 0 0 .22  0 0 0 .9 0'/></filter><rect width='300' height='300' filter='url(%23f)'/></svg>");
    background-size:420px 420px;}

  .bars{height:11px;background:linear-gradient(90deg,
    var(--red) 0 16.66%, var(--orange) 16.66% 33.3%, #F5C43C 33.3% 50%,
    var(--green) 50% 66.6%, var(--blue) 66.6% 83.3%, var(--purple) 83.3% 100%);}

  /* ── 页眉 ── */
  .head{position:absolute;left:60px;right:60px;top:44px;z-index:20;
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--mono);font-size:19px;letter-spacing:.15em;color:rgba(43,38,32,.62);}
  .rule{position:absolute;left:60px;right:60px;top:78px;height:2px;
    background:rgba(43,38,32,.55);z-index:20;}

  /* ── 标本墙 ── */
  #wall{position:absolute;left:60px;top:104px;width:960px;z-index:10;
    display:grid;grid-template-columns:repeat(8,1fr);gap:7px;}
  .tile{position:relative;aspect-ratio:1/1;background:#fff;overflow:hidden;
    box-shadow:0 0 0 1px rgba(43,38,32,.22);}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;}
  .tile.empty{background:transparent;box-shadow:0 0 0 1px rgba(43,38,32,.10);}

  /* ── 文件卡（叠在墙上） ── */
  #file{position:absolute;left:92px;top:706px;z-index:30;width:566px;
    background:#fff;transform:rotate(-3.2deg);
    box-shadow:0 0 0 3px var(--ink), 16px 18px 0 rgba(43,38,32,.16), 0 30px 60px rgba(43,38,32,.20);
    padding:24px 26px;display:flex;gap:22px;align-items:center;}
  #file .ico{position:relative;flex:0 0 auto;width:104px;height:126px;background:var(--red);
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:14px;}
  #file .ico span{font-family:var(--mono);font-size:16px;color:#fff;letter-spacing:.06em;}
  #file .ico i{position:absolute;right:0;top:0;width:0;height:0;
    border-left:26px solid var(--paper);border-bottom:26px solid #B32219;}
  #file .nm{font-size:31px;font-weight:700;line-height:1.28;letter-spacing:-.01em;}
  #file .sz{font-family:var(--mono);font-size:19px;color:var(--ink2);margin-top:8px;letter-spacing:.06em;}

  /* ── 标题区 ── */
  #title{position:absolute;left:60px;bottom:286px;z-index:40;}
  #title h1{font-size:196px;font-weight:900;line-height:.92;letter-spacing:-.035em;
    text-shadow:8px 8px 0 rgba(226,52,43,.15);}
  #title .en{margin-top:20px;font-family:var(--mono);font-size:24px;color:var(--red);letter-spacing:.19em;}

  /* ── 底部 ── */
  #foot{position:absolute;left:60px;right:60px;bottom:52px;z-index:40;}
  #stats{display:flex;margin-bottom:22px;}
  #stats div{flex:1;padding-left:20px;border-left:2px solid rgba(43,38,32,.24);}
  #stats div:first-child{padding-left:0;border-left:0;}
  #stats .n{font-family:var(--disp);font-weight:900;font-size:66px;line-height:.88;}
  #stats .l{font-family:var(--cjk);font-size:20px;color:var(--ink2);margin-top:7px;letter-spacing:.03em;}

  #cta{display:flex;align-items:center;justify-content:space-between;
    background:var(--ink);color:var(--paper);padding:19px 26px;}
  #cta .t{font-size:29px;font-weight:700;letter-spacing:.01em;}
  #cta .u{font-family:var(--mono);font-size:19px;letter-spacing:.03em;color:rgba(240,235,222,.82);}
</style>
</head>
<body>
<div id="cover">
  <div class="head">
    <span>普通高等教育「野生」通识教材 · 第一册</span>
    <span>全 75 枚 · 逐条编号</span>
  </div>
  <div class="rule"></div>

  <div id="wall"></div>

  <div id="file">
    <div class="ico"><span>PDF</span><i></i></div>
    <div>
      <div class="nm">期中复习资料-1副本.pdf</div>
      <div class="sz">18.5 MB · 2026.11.11 23:47</div>
    </div>
  </div>

  <div id="title">
    <h1>奶娃图鉴</h1>
    <div class="en">A FIELD GUIDE TO MILK FROG VARIANTS</div>
  </div>

  <div id="foot">
    <div class="bars" style="margin-bottom:20px"></div>
    <div id="stats"></div>
    <div id="cta">
      <span class="t">完整 75 枚 · 见主页</span>
      <span class="u">naiwa-studies-101.app.workbuddy.host</span>
    </div>
  </div>

  <div id="halftone"></div>
  <div id="fiber"></div>
</div>

<script>
(async () => {
  const data = await (await fetch('/film/data/specs.json')).json();

  // 标本墙：8 列 × 6 行，只用非「奶字母」标本
  // 字母类在缩略图里会读成一排键盘字符，和标题抢读，所以排除
  const wall = document.getElementById('wall');
  const pick = data.filter(x => !x.name.includes('奶字母')).slice(0, 48);
  wall.innerHTML = pick
    .map(x => `<div class="tile"><img src="/film/app/assets/${x.img}" alt="${x.name}"></div>`)
    .join('');

  document.getElementById('stats').innerHTML = [
    ['75', '枚标本'], ['6', '大类'], ['33', '教材原图'], ['42', '外部形象'],
  ].map(([n, l]) => `<div><div class="n">${n}</div><div class="l">${l}</div></div>`).join('');

  const imgs = [...document.images];
  await Promise.all(imgs.map(im => im.complete ? Promise.resolve()
    : new Promise(r => { im.onload = im.onerror = r; })));
  await new Promise(r => setTimeout(r, 400));
  window.__ready = true;
})();
</script>
</body>
</html>
